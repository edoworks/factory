name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Factory policy gate
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install declared build dependency
        run: brew install xcodegen

      - name: Check lifecycle script syntax
        run: |
          bash -n bin/factory-doctor
          bash -n bin/factory-init
          bash -n bin/factory-storage
          bash -n bin/factory-verify
          bash -n bin/factory-uninstall
          python3 -c 'compile(open("bin/factory-dev").read(), "bin/factory-dev", "exec")'

      - name: Test OpenCode cost router
        run: node --test development/opencode/plugins/cost-router.test.mjs development/opencode/scripts/*.test.mjs

      - name: Run factory doctor
        run: ./bin/factory-doctor | tee doctor-receipt.json

      - name: Validate doctor receipt
        run: python3 -m json.tool doctor-receipt.json >/dev/null

      - name: Validate public consolidation evidence
        run: python3 scripts/check_consolidation_evidence.py

      - name: Run Python unit tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Capture external storage baseline
        run: python3 scripts/external_storage_attribution.py snapshot --output /tmp/external-storage-before.json

      - name: Verify template builds
        # Run 36117730389 reached the former 8-minute bound during the first
        # cold hosted xcodebuild. Keep this within the 25-minute job bound.
        timeout-minutes: 15
        env:
          # Hosted CoreSimulator/APFS drift observed at 129, 664, and 227 MiB.
          # Do not raise this bound again without external-owner attribution.
          FACTORY_STORAGE_GROWTH_TOLERANCE_MIB: 768
        run: |
          cd /tmp
          ${{ github.workspace }}/bin/factory-init TestApp --bundle-id com.example.testapp
          cd TestApp
          ${{ github.workspace }}/bin/factory-verify

      - name: Capture external storage attribution
        if: always()
        run: |
          python3 scripts/external_storage_attribution.py snapshot --output /tmp/external-storage-after.json
          python3 scripts/external_storage_attribution.py compare \
            --before /tmp/external-storage-before.json \
            --after /tmp/external-storage-after.json \
            --output external-storage-attribution.json

      - name: Upload external storage attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-storage-attribution
          if-no-files-found: error
          path: external-storage-attribution.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-evidence
          path: |
            doctor-receipt.json
            /tmp/TestApp/.factory-verify-result.json

  reference-app:
    name: Mews & Woofs (${{ matrix.form_factor }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - form_factor: iPhone
            simulator_key: IPHONE
          - form_factor: iPad
            simulator_key: IPAD
    steps:
      - uses: actions/checkout@v4

      - name: Install declared build dependency
        run: brew install xcodegen

      - name: Verify reference app
        timeout-minutes: 15
        run: |
          SIMULATORS="$(python3 ./bin/find-simulators.py)"
          DESTINATION="$(printf '%s\n' "$SIMULATORS" | awk -F= '$1 == "${{ matrix.simulator_key }}" { print $2 }')"
          test -n "$DESTINATION"
          xcodegen generate --spec reference-apps/MewsAndWoofs/project.yml
          xcodebuild test \
            -project reference-apps/MewsAndWoofs/MewsAndWoofs.xcodeproj \
            -scheme MewsAndWoofs \
            -destination "platform=iOS Simulator,id=$DESTINATION" \
            -resultBundlePath "/tmp/MewsAndWoofs-${{ matrix.form_factor }}.xcresult"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mews-and-woofs-${{ matrix.form_factor }}-evidence
          path: /tmp/MewsAndWoofs-${{ matrix.form_factor }}.xcresult
