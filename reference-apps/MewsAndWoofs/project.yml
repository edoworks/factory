name: MewsAndWoofs
options:
  bundleIdPrefix: ai.edoworks
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MewsAndWoofs:
    type: application
    platform: iOS
    sources:
      - MewsAndWoofs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.edoworks.mewsandwoofs.internal
        INFOPLIST_FILE: MewsAndWoofs/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
  MewsAndWoofsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MewsAndWoofsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.edoworks.mewsandwoofs.internal.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MewsAndWoofs
  MewsAndWoofsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MewsAndWoofsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.edoworks.mewsandwoofs.internal.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MewsAndWoofs
